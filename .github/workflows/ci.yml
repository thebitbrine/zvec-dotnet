name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64

    name: test (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # gives every runner the same "python" command
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Prebuilt library from the upstream zvec release, hash-checked
      - name: Fetch native library
        run: python native/fetch-native.py ${{ matrix.rid }}

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity minimal --filter "FullyQualifiedName!~LargeScale"

      - name: Run sample
        run: dotnet run --configuration Release --no-build --project samples/BasicSearch

  pack:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fetch native libraries for every platform
        run: python3 native/fetch-native.py all

      # A v* tag sets the package version; other builds use the one in Directory.Build.props
      - name: Pack
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_ARG="-p:Version=${GITHUB_REF_NAME#v}"
          fi
          dotnet pack src/Zvec.Native/Zvec.Native.csproj --configuration Release --output nupkg $VERSION_ARG
          dotnet pack src/Zvec/Zvec.csproj --configuration Release --output nupkg $VERSION_ARG
          ls -lh nupkg

      # Install the packages the way a user would and run the sample against them,
      # so a broken runtimes/ layout or dependency fails here and not on nuget.org.
      # The project lives outside the checkout so it doesn't inherit Directory.Build.props.
      - name: Smoke test packages
        run: |
          VERSION=$(ls nupkg/Zvec.Native.*.nupkg | sed -E 's/.*Zvec\.Native\.(.*)\.nupkg/\1/')
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          dotnet new console --framework net8.0 --no-restore
          cp "$GITHUB_WORKSPACE/samples/BasicSearch/Program.cs" Program.cs
          dotnet add package Zvec --version "$VERSION" --source "$GITHUB_WORKSPACE/nupkg"
          dotnet run

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: nupkg/*.*nupkg

  publish:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: nupkg

      # Zvec depends on Zvec.Native, so that one goes first
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet nuget push "nupkg/Zvec.Native.$VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "nupkg/Zvec.$VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            nupkg/*.nupkg
            nupkg/*.snupkg
